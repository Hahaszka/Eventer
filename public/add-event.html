<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dodaj Wydarzenie - Eventer</title>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="/css/styles.css" />

    <style>
      /* Mapa musi mieć wysokość, inaczej się nie wyświetli */
      #mapPicker {
        height: 100%;
        min-height: 400px;
        border-radius: 1rem;
        z-index: 1;
      }
      .form-section {
        height: 100%;
      }
    </style>
  </head>
  <body class="bg-light">
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 sticky-top"
    >
      <div class="container">
        <a class="navbar-brand fw-bold tracking-wide" href="/dashboard.html"
          >EVENTER</a
        >

        <div class="d-flex align-items-center gap-2">
          <a href="/dashboard.html" class="btn btn-outline-dark btn-sm fw-bold">
            <i class="fas fa-arrow-left me-2"></i>Anuluj
          </a>
        </div>
      </div>
    </nav>

    <div class="container mb-5">
      <div class="row g-4 align-items-stretch">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-4 d-flex flex-column">
              <h3 class="fw-bold mb-4">Nowe Wydarzenie</h3>

              <div id="formAlert" class="alert alert-danger d-none small"></div>

              <form id="addEventForm" class="flex-grow-1 d-flex flex-column">
                <div class="mb-3">
                  <label class="form-label small fw-bold text-muted"
                    >TYTUŁ WYDARZENIA</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="title"
                    placeholder="Np. Nocne granie w RPG"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold text-muted"
                    >DATA I GODZINA</label
                  >
                  <input
                    type="datetime-local"
                    class="form-control"
                    name="event_date"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold text-muted"
                    >OPIS</label
                  >
                  <textarea
                    class="form-control"
                    name="description"
                    rows="5"
                    placeholder="Opisz, co będzie się działo..."
                    required
                  ></textarea>
                </div>

                <input type="hidden" name="latitude" id="latInput" />
                <input type="hidden" name="longitude" id="lngInput" />

                <div class="mt-auto pt-3">
                  <div
                    class="alert alert-info small d-flex align-items-center"
                    id="locationStatus"
                  >
                    <i class="fas fa-map-marker-alt me-2 text-danger"></i>
                    <span>Kliknij na mapie, aby wybrać lokalizację.</span>
                  </div>

                  <button
                    type="submit"
                    class="btn btn-black w-100 rounded-pill fw-bold py-3"
                    id="submitBtn"
                    disabled
                  >
                    <i class="fas fa-plus me-2"></i> Opublikuj Wydarzenie
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card border-0 shadow-sm rounded-4 h-100 p-1 bg-white">
            <div id="mapPicker"></div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="globalLoader"
      class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center"
      style="
        background: rgba(255, 255, 255, 0.8);
        z-index: 9999;
        backdrop-filter: blur(2px);
      "
    >
      <div
        class="spinner-border text-dark"
        style="width: 3rem; height: 3rem"
        role="status"
      ></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="/js/loader.js"></script>
    <script src="/js/add-event.js"></script>
  </body>
</html>
