<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventer - Autoryzacja</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="login-card bg-white p-4 p-md-5 rounded shadow-sm fade-in">
        
        <div class="text-center mb-4">
            <h1 class="fw-bold tracking-wide">EVENTER</h1>
            <p class="text-muted mt-2" id="headerText">
                Witaj ponownie. Zaloguj się, aby kontynuować.
            </p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
        <div id="successBox" class="alert alert-success d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">EMAIL</label>
                <input type="email" class="form-control form-control-lg" name="username" placeholder="twoj@email.com" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">HASŁO</label>
                <input type="password" class="form-control form-control-lg" name="password" placeholder="••••••••" required>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <a href="#" class="text-decoration-none text-muted small">Zapomniałeś hasła?</a>
            </div>

            <button type="submit" class="btn btn-black w-100 btn-lg mb-3 rounded-pill fw-bold">
                Zaloguj się
            </button>
        </form>

        <form id="registerForm" class="d-none">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">EMAIL</label>
                <input type="email" class="form-control form-control-lg" id="regEmail" placeholder="twoj@email.com" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">HASŁO</label>
                <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Minimum 8 znaków" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">POWTÓRZ HASŁO</label>
                <input type="password" class="form-control form-control-lg" id="regPasswordConfirm" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-black w-100 btn-lg mb-3 rounded-pill fw-bold">
                Stwórz konto
            </button>
        </form>

        <div class="d-flex align-items-center mb-3 mt-2">
            <hr class="flex-grow-1">
            <span class="mx-3 text-muted small">LUB</span>
            <hr class="flex-grow-1">
        </div>

        <button class="btn btn-google w-100 btn-lg rounded-pill fw-bold mb-4" id="googleBtn">
            <i class="fab fa-google me-2"></i> Kontynuuj z Google
        </button>

        <div class="text-center mt-3">
            <span id="toggleText">Nie masz jeszcze konta?</span>
            <a href="#" id="toggleModeBtn" class="text-dark fw-bold ms-1">Zarejestruj się</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
