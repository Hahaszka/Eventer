<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowanie | System WMS AI</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg border">
      <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
        Panel Dostępu
      </h2>

      <form id="loginForm" class="space-y-4">
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Login"
          class="w-full border rounded p-3 outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Hasło"
          class="w-full border rounded p-3 outline-none focus:ring-2 focus:ring-blue-500"
          required
        />
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition"
        >
          Zaloguj do systemu
        </button>
      </form>

      <p
        id="errorMsg"
        class="text-red-500 text-sm mt-4 hidden text-center italic font-medium bg-red-50 p-2 rounded"
      >
        Nieprawidłowy login lub hasło!
      </p>
    </div>

    <script>
      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const fd = new URLSearchParams({ username: u, password: p });

        try {
          const res = await fetch("/token", { method: "POST", body: fd });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem("access_token", data.access_token);
            document.cookie = `access_token=${data.access_token}; path=/; max-age=86400`;
            window.location.href = "/dashboard";
          } else {
            document.getElementById("errorMsg").classList.remove("hidden");
          }
        } catch (err) {
          alert("Błąd połączenia z serwerem.");
        }
      };
    </script>
  </body>
</html>
